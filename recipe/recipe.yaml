# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"
  python_check_max: "3.14"

package:
  name: demoji
  version: ${{ version }}

source:
  # pypi does not include tests
  url: https://github.com/bsolomon1124/demoji/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 626eeaedbea9c17e2de1e094e8aeb3eb80ace4138c10d8f32872b1c4fb064ad6

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
  python:
    entry_points:
      - demoji = demoji.main:main

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - uv-build >= 0.11.7,<0.12
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports: demoji
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - tests/
    requirements:
      run:
        - pytest-cov
        - python ${{ python_min }}.*
    script:
      - demoji --help
      - coverage run --source=demoji --branch -m pytest -vv --tb=long --color=yes
      - coverage report --show-missing --skip-covered --fail-under=60

about:
  summary: Accurately remove and replace emojis in text strings
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/demoji
  repository: https://github.com/bsolomon1124/demoji

extra:
  recipe-maintainers:
    - bollwyvl
